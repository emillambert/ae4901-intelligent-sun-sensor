name: Verify Python reference implementation
on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python runtime/pc/host.py --demo
      - run: python tools/check_archive_integrity.py
      - name: Mock Arduino C++ syntax (not a real board compilation)
        run: |
          g++ -std=c++17 -fsyntax-only -x c++ -DBOARD_ID=0 -I tests/mock_arduino runtime/firmware/SunNode/SunNode.ino
          g++ -std=c++17 -fsyntax-only -x c++ -DBOARD_ID=1 -I tests/mock_arduino runtime/firmware/SunNode/SunNode.ino
